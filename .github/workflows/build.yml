name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios-build:
    name: Build iOS IPA for SideStore
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download iOS binary dependencies
        run: |
          chmod +x ./scripts/setup-ios-deps.sh
          ./scripts/setup-ios-deps.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project VoicePingIOSAndroidOfflineSpeechTranslation.xcodeproj \
            -scheme OfflineTranscription \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO
      - name: Find built app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products \
            -type d \
            -name "*.app" \
            -not -path "*/Index.noindex/*" \
            | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            find build/DerivedData/Build/Products -maxdepth 5 -print || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - name: Create SideStore IPA
        run: |
          set -euo pipefail
          rm -rf build/ios
          mkdir -p build/ios/Payload
          APP_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "build/ios/Payload/$APP_NAME"
          cd build/ios
          zip -qry \
            OfflineTranscription-SideStore.ipa \
            Payload
          rm -rf Payload
          echo "IPA created:"
          ls -lh OfflineTranscription-SideStore.ipa
          echo "IPA contents:"
          unzip -l OfflineTranscription-SideStore.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranscription-SideStore-IPA
          path: build/ios/OfflineTranscription-SideStore.ipa
          if-no-files-found: error
          retention-days: 30
  publish-release:
    name: Publish GitHub Release
    needs: ios-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: OfflineTranscription-SideStore-IPA
          path: release-assets
      - name: Create release notes
        run: |
          cat > release-assets/RELEASE.md <<'EOF'
          # OfflineTranscription — SideStore
          ## Install with SideStore
          1. Open this release on your iPhone.
          2. Tap **OfflineTranscription-SideStore.ipa** under Assets.
          3. Download the IPA.
          4. Open it with SideStore.
          5. Allow SideStore to sign and install the app with your Apple ID.
          **Important:** This IPA is unsigned. SideStore is responsible for signing it before installation.
          ## IPA
          **OfflineTranscription-SideStore.ipa**
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: OfflineTranscription — SideStore
          body: |
            ## 📱 OfflineTranscription for SideStore
            Download the IPA below and open it with SideStore.
            ### 👉 IPA
            **OfflineTranscription-SideStore.ipa**
            ### Installation
            1. Download the IPA on your iPhone.
            2. Open/share it to SideStore.
            3. SideStore signs it using your Apple ID.
            4. Install the app.
            This GitHub build is unsigned; SideStore performs the signing.
          prerelease: true
          generate_release_notes: false
          files: |
            release-assets/OfflineTranscription-SideStore.ipa
          fail_on_unmatched_files: true
          overwrite_files: true
            publish-release:
    name: Publish Latest SideStore IPA
    needs: ios-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: OfflineTranscription-SideStore-IPA
          path: release-assets

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OfflineTranscription — Latest SideStore Build
          body: |
            # OfflineTranscription

            ## 📱 SideStore IPA

            Download the latest IPA below:

            **OfflineTranscription-SideStore.ipa**

            This IPA is unsigned and is intended to be imported into SideStore.
          prerelease: true
          make_latest: false
          files: |
            release-assets/OfflineTranscription-SideStore.ipa
          fail_on_unmatched_files: true
          overwrite_files: true
          

